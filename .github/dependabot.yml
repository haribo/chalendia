# One entry per packaging ecosystem the repository actually contains. An
# ecosystem with a manifest and no entry here is a dependency nobody is
# watching — the file existing is not the guarantee, the coverage is.
#
# This drives version updates only. Security alerts are a repository setting,
# invisible from the tree, and not covered here.

version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/apps/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One pull request per week rather than one per crate: a shop this size
      # has no reviewer for fifteen.
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/apps/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # TypeScript 7 exists and the lint toolchain does not support it:
    # typescript-eslint 8 asks for `>=4.8.4 <6.1.0`, so a bump to 7 makes
    # `npm ci` refuse the tree and takes every other update down with it.
    #
    # This holds the major version only — minors and patches still come. Lift
    # it when typescript-eslint widens its peer range; nothing else does.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-dependencies:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
