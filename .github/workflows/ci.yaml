name: CI

# Every gate here is runnable locally through `just`, with the same command.
# A gate that only exists in CI is a gate nobody can reproduce.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: chalendia
          POSTGRES_PASSWORD: chalendia
          POSTGRES_DB: chalendia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chalendia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://chalendia:chalendia@localhost:5432/chalendia

    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        run: rustup component add rustfmt clippy

      # The AVIF encoder builds its assembly paths with nasm, and refuses to
      # build without it (docs/backend/adr/0008-image-pipeline.md).
      - name: Install nasm
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm

      - uses: extractions/setup-just@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend

      # Through `just` so CI and a developer's machine run the same definition
      # of each gate — a divergence here is a gate nobody can reproduce.
      - name: Format and lint
        run: just backend-check

      - name: Test
        run: just backend-test

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version ^0.9 --locked --no-default-features --features rustls,postgres

      - name: Check the committed query cache is current
        run: just backend-sqlx-check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - uses: extractions/setup-just@v4

      - name: Install dependencies
        run: just frontend-install

      - name: Type check and lint
        run: just frontend-check

      - name: Test
        run: just frontend-test

      - name: Build
        run: just frontend-build

      - name: Check the generated api types are current
        run: just api-check

  image:
    name: Container image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t chalendia:ci .

      - name: Refuse an image running as root
        run: |
          user=$(docker image inspect chalendia:ci --format '{{.Config.User}}')
          test -n "$user" && test "$user" != "root" \
            || (echo "image runs as '${user:-root}'"; exit 1)
          echo "image runs as $user"

  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - uses: extractions/setup-just@v4

      - name: Install dependencies
        run: just frontend-install

      - name: Install the browser
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      # Against the image, on one origin — the way an operator installs it.
      - name: Run the journeys
        run: just e2e-image

      - name: Keep the artefacts of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: apps/frontend/tmp/e2e-artifacts
          retention-days: 7
